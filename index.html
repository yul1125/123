<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古早味早餐 - 線上點餐</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="header">早安！古早味早餐</div>
    <div class="container">
        <div class="category-title">🍞 熱門主食</div>
        <div class="menu-list">
            <div class="menu-item">
                <div class="item-info">
                    <span class="item-name">肉粽</span>
                    <span class="item-price">$35</span>
                </div>
                <button class="add-btn" onclick="addToCart('肉粽', 35)">+</button>
            </div>
            <div class="menu-item">
                <div class="item-info">
                    <span class="item-name">魯肉飯</span>
                    <span class="item-price">$30</span>
                </div>
                <button class="add-btn" onclick="addToCart('魯肉飯', 30)">+</button>
            </div>
        </div>
    </div>

    <div class="cart-bar">
        <div class="cart-total" id="cart-text">購物車空空的</div>
        <button class="checkout-btn" onclick="submitOrder()">送出訂單</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
